* { box-sizing: border-box; }

/* =========================
   STATE + STORAGE
========================= */
let state = { courseKey:null, index:0, score:0, answers:[] };

function saveResult(courseKey, score, total) {
  const h = JSON.parse(localStorage.getItem("scores")) || {};
  if (!h[courseKey]) h[courseKey] = [];
  h[courseKey].push({ date:new Date().toLocaleDateString(), score, total });
  localStorage.setItem("scores", JSON.stringify(h));
}

function getHistory(courseKey) {
  return (JSON.parse(localStorage.getItem("scores")) || {})[courseKey] || [];
}

/* =========================
   UI
========================= */
const dashboardEl = document.getElementById("dashboard");
const quizEl = document.getElementById("quiz");
const resultsEl = document.getElementById("results");

function renderDashboard() {
  dashboardEl.innerHTML = "";
  dashboardEl.classList.remove("hidden");
  quizEl.classList.add("hidden");
  resultsEl.classList.add("hidden");

  for (let key in courses) {
    const last = getHistory(key).slice(-1)[0];
    const card = document.createElement("div");
    card.className = "card course-item";
    card.innerHTML = `
      <div>
        <strong>${courses[key].title}</strong>
        <div class="course-score">
          ${last ? `Last score: ${last.score}/${last.total}` : "No attempts yet"}
        </div>
      </div>
      <button class="primary">Start</button>
    `;
    card.querySelector("button").onclick = () => startQuiz(key);
    dashboardEl.appendChild(card);
  }
}

function startQuiz(key) {
  state = { courseKey:key, index:0, score:0, answers:[] };
  dashboardEl.classList.add("hidden");
  quizEl.classList.remove("hidden");
  renderQuestion();
}

function renderQuestion() {
  const c = courses[state.courseKey];
  const q = c.questions[state.index];

  quizEl.innerHTML = `
    <div class="card">
      <div class="progress">Question ${state.index+1}/${c.questions.length}</div>
      <h2>${q.q}</h2>
      ${q.options.map((o,i)=>`<button class="option" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}
      <div class="feedback hidden"></div>
      <button class="primary hidden" id="nextBtn">Next</button>
    </div>
  `;

  quizEl.querySelectorAll(".option").forEach(b=>{
    b.onclick = selectAnswer;
    b.ontouchstart = selectAnswer;
  });
}

function selectAnswer(e) {
  const btn = e.currentTarget;
  const sel = +btn.dataset.i;
  const q = courses[state.courseKey].questions[state.index];

  quizEl.querySelectorAll(".option").forEach(b=>b.disabled=true);

  if (sel === q.answer) {
    btn.classList.add("correct");
    state.score++;
  } else {
    btn.classList.add("wrong");
    quizEl.querySelectorAll(".option")[q.answer].classList.add("correct");
  }

  state.answers.push(sel);
  quizEl.querySelector(".feedback").textContent = q.explanation;
  quizEl.querySelector(".feedback").classList.remove("hidden");

  const next = document.getElementById("nextBtn");
  next.classList.remove("hidden");
  next.onclick = nextQuestion;
}

function nextQuestion() {
  state.index++;
  if (state.index < courses[state.courseKey].questions.length) renderQuestion();
  else finishQuiz();
}

function finishQuiz() {
  const total = courses[state.courseKey].questions.length;
  saveResult(state.courseKey, state.score, total);

  quizEl.classList.add("hidden");
  resultsEl.classList.remove("hidden");

  resultsEl.innerHTML = `
    <div class="card">
      <h2>Results</h2>
      <p>Score: ${state.score}/${total}</p>
      <p>${Math.round(state.score/total*100)}%</p>
      <button class="primary" onclick="renderDashboard()">Back to Dashboard</button>
    </div>
  `;
}

renderDashboard();
</script>
</body>
</html>
