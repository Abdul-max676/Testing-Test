let timeLeft=40*60;
let timer;

/* =====================
   UI
===================== */
const dashboard=document.getElementById("dashboard");
const quiz=document.getElementById("quiz");
const results=document.getElementById("results");

dashboard.innerHTML=`
<div class="card">
<h3>ENT211 CBT</h3>
<p>100 questions • 40 minutes</p>
<button class="primary" onclick="start()">Start Test</button>
</div>`;

function shuffleArray(array){
  const arr = [...array]; // clone, do NOT mutate original
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
  
function start(){
  index = 0;
  score = 0;
  answers = [];
  timeLeft = 40 * 60;

  activeQuestions = shuffleArray(questions);

  dashboard.classList.add("hidden");
  quiz.classList.remove("hidden");

  startTimer();
  render();
}

function startTimer(){
  timer=setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){
      clearInterval(timer);
      finish();
    }
    document.getElementById("timer").textContent=formatTime(timeLeft);
  },1000);
}

function formatTime(s){
  const m=Math.floor(s/60),sec=s%60;
  return `${m}:${sec.toString().padStart(2,"0")}`;
}

function render(){
  const q = activeQuestions[index];
  quiz.innerHTML=`
  <div class="timer" id="timer">${formatTime(timeLeft)}</div>
  <div class="card">
    <div class="progress">Question ${index+1}/100</div>
    <h3>${q.q}</h3>
    ${q.options.map((o,i)=>`<button class="option" onclick="select(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}
    <button class="primary hidden" id="next" onclick="next()">Next</button>
  </div>`;
}

function select(i){
  if(answers[index]!=null)return;
  answers[index]=i;
  const q = activeQuestions[index];
  document.querySelectorAll(".option").forEach((b,idx)=>{
    b.disabled=true;
    if(idx===q.answer)b.classList.add("correct");
    if(idx===i && i!==q.answer)b.classList.add("wrong");
  });
  if(i===q.answer)score++;
  document.getElementById("next").classList.remove("hidden");
}

function next(){
  index++;
  index<100?render():finish();
}

function finish(){
  clearInterval(timer);
  quiz.classList.add("hidden");
  results.classList.remove("hidden");

  const wrong = activeQuestions
    .map((q,i)=>({q,i}))
    .filter(x=>answers[x.i]!==x.q.answer);

  results.innerHTML=`
  <div class="card">
    <h3>Result</h3>
    <p>Score: ${score}/100</p>
    <p>${score}%</p>
  </div>
  ${wrong.map(w=>`
    <div class="card review-wrong">
      <strong>${w.q.q}</strong>
      <p>Your answer: ${String.fromCharCode(65+answers[w.i])}</p>
      <p class="review-correct">Correct: ${String.fromCharCode(65+w.q.answer)}</p>
      <p>${w.q.explanation}</p>
    </div>
  `).join("")}
  <button class="primary" onclick="location.reload()">Restart</button>`;
}
