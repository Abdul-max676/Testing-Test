<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Practice Portal</title>

<style>
:root {
  --bg:#f7f9fc;
  --card:#ffffff;
  --primary:#1e40af;
  --correct:#16a34a;
  --wrong:#dc2626;
  --muted:#6b7280;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:var(--bg);
  color:#111827;
}

header{
  padding:16px;
  text-align:center;
  background:var(--primary);
  color:#fff;
  font-weight:600;
}

main{
  padding:16px;
  max-width:480px;
  margin:auto;
}

.hidden{display:none}

.card{
  background:var(--card);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}

h2{margin-top:0;font-size:18px}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  font-size:16px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:#e5e7eb;
}

button.primary{
  background:var(--primary);
  color:#fff;
}

button.option{text-align:left}

button.correct{background:var(--correct);color:#fff}
button.wrong{background:var(--wrong);color:#fff}

.progress{
  font-size:14px;
  color:var(--muted);
}

.feedback{
  margin-top:12px;
  font-size:14px;
}

.course-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.course-score{font-size:13px;color:var(--muted)}
</style>
</head>

<body>
<header>Student Practice Portal</header>

<main>
  <section id="dashboard"></section>
  <section id="quiz" class="hidden"></section>
  <section id="results" class="hidden"></section>
</main>

<script>
/* =========================
   DATA
========================= */
const courses={
  ent211:{
    title:"ENT211 – Introduction to Entrepreneurship",
    questions:[
      {
        q:"Which is a key characteristic of a successful entrepreneur?",
        options:["Risk aversion","Creativity","Dependence on others","Lack of vision"],
        answer:1,
        explanation:"Creativity helps entrepreneurs identify opportunities."
      },
      {
        q:"Primary purpose of a business plan?",
        options:["Secure a loan","Outline business idea and strategy","Avoid competition","Hire employees"],
        answer:1,
        explanation:"A business plan defines goals and strategy."
      },
      {
        q:"Financial statement showing revenues and expenses?",
        options:["Balance Sheet","Cash Flow Statement","Income Statement","Retained Earnings"],
        answer:2,
        explanation:"Income statement shows revenues and expenses."
      },
      {
        q:"Example of bootstrapping?",
        options:["Personal savings","Venture capital","Bank loan","Issuing shares"],
        answer:0,
        explanation:"Bootstrapping uses personal funds."
      },
      {
        q:"Scalability refers to?",
        options:["Entering new markets","Ability to grow efficiently","Creating business plans","Reducing costs"],
        answer:1,
        explanation:"Scalability is growth without proportional cost increase."
      },

      /* ===== leadership & skills ===== */

      {
        q:"Critical leadership aspect?",
        options:["Delegation","Motivation","Avoid conflict","Short-term focus"],
        answer:1,
        explanation:"Motivation drives team performance."
      },
      {
        q:"What does emotional intelligence refer to?",
        options:[
          "Controlling others’ emotions",
          "Awareness and management of emotions",
          "Ignoring emotions",
          "Avoiding communication"
        ],
        answer:1,
        explanation:"EI is understanding and managing emotions."
      },
      {
        q:"Key benefit of strong problem-solving skills?",
        options:[
          "Reducing teamwork",
          "Resolving issues effectively",
          "Avoiding challenges",
          "Delegating all tasks"
        ],
        answer:1,
        explanation:"Problem-solving helps overcome challenges."
      },
      {
        q:"Why is adaptability important?",
        options:[
          "Resisting change",
          "Adjusting to new environments",
          "Avoiding learning",
          "Limiting growth"
        ],
        answer:1,
        explanation:"Adaptability enables success in change."
      },

      /* ===== Nigerian entrepreneurship ===== */

      {
        q:"SMEDAN stands for?",
        options:[
          "Small and Medium Enterprises Development Agency of Nigeria",
          "Small Enterprise Department",
          "Strong Measures Enterprise Agency",
          "Medium Business Office"
        ],
        answer:0,
        explanation:"SMEDAN supports SMEs in Nigeria."
      },
      {
        q:"NDE means?",
        options:[
          "National Directorate of Entrepreneurship",
          "National Directorate of Employment",
          "National Development Enterprise",
          "National Democracy Entity"
        ],
        answer:1,
        explanation:"NDE focuses on employment creation."
      },
      {
        q:"SAP means?",
        options:[
          "Structural Adjustment Programme",
          "Structured Accounting Policy",
          "Social Action Plan",
          "Systematic Adjustment Process"
        ],
        answer:0,
        explanation:"SAP stands for Structural Adjustment Programme."
      },

      /* ===== business basics ===== */

      {
        q:"Contract is?",
        options:[
          "Verbal promise",
          "Legally binding agreement",
          "Informal note",
          "Personal understanding"
        ],
        answer:1,
        explanation:"Contracts are legally enforceable."
      },
      {
        q:"Insurance helps businesses to?",
        options:[
          "Increase profit",
          "Avoid taxes",
          "Protect against risk",
          "Hire employees"
        ],
        answer:2,
        explanation:"Insurance protects against losses."
      },
      {
        q:"Capital goods are used for?",
        options:[
          "Consumption",
          "Further production",
          "Luxury",
          "Decoration"
        ],
        answer:1,
        explanation:"Capital goods aid production."
      }
    ]
  }
};

/* =========================
   STATE
========================= */
let state={course:null,index:0,score:0,answers:[]};

/* =========================
   STORAGE
========================= */
function saveResult(key,score,total){
  const h=JSON.parse(localStorage.getItem("scores"))||{};
  if(!h[key])h[key]=[];
  h[key].push({date:new Date().toLocaleDateString(),score,total});
  localStorage.setItem("scores",JSON.stringify(h));
}

function getHistory(key){
  return(JSON.parse(localStorage.getItem("scores"))||{})[key]||[];
}

/* =========================
   UI
========================= */
const dashboard=document.getElementById("dashboard");
const quiz=document.getElementById("quiz");
const results=document.getElementById("results");

function renderDashboard(){
  dashboard.innerHTML="";
  dashboard.classList.remove("hidden");
  quiz.classList.add("hidden");
  results.classList.add("hidden");

  for(const key in courses){
    const last=getHistory(key).slice(-1)[0];
    const card=document.createElement("div");
    card.className="card course-item";
    card.innerHTML=`
      <div>
        <strong>${courses[key].title}</strong>
        <div class="course-score">
          ${last?`Last score: ${last.score}/${last.total}`:"No attempts yet"}
        </div>
      </div>
      <button class="primary">Start</button>
    `;
    card.querySelector("button").onclick=()=>startQuiz(key);
    dashboard.appendChild(card);
  }
}

function startQuiz(key){
  state={course:key,index:0,score:0,answers:[]};
  dashboard.classList.add("hidden");
  quiz.classList.remove("hidden");
  renderQuestion();
}

function renderQuestion(){
  const q=courses[state.course].questions[state.index];

  quiz.innerHTML=`
    <div class="card">
      <div class="progress">Question ${state.index+1}/${courses[state.course].questions.length}</div>
      <h2>${q.q}</h2>
      ${q.options.map((o,i)=>`<button class="option" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}
      <div class="feedback hidden"></div>
      <button class="primary hidden" id="nextBtn">Next</button>
    </div>
  `;

  quiz.querySelectorAll(".option").forEach(b=>{
    b.onclick=selectAnswer;
  });
}

function selectAnswer(e){
  if(state.answers[state.index]!==undefined)return;

  const btn=e.currentTarget;
  const sel=+btn.dataset.i;
  const q=courses[state.course].questions[state.index];

  quiz.querySelectorAll(".option").forEach(b=>b.disabled=true);

  if(sel===q.answer){
    btn.classList.add("correct");
    state.score++;
  }else{
    btn.classList.add("wrong");
    quiz.querySelectorAll(".option")[q.answer].classList.add("correct");
  }

  state.answers.push(sel);
  const fb=quiz.querySelector(".feedback");
  fb.textContent=q.explanation;
  fb.classList.remove("hidden");

  const next=document.getElementById("nextBtn");
  next.classList.remove("hidden");
  next.onclick=nextQuestion;
}

function nextQuestion(){
  state.index++;
  state.index<courses[state.course].questions.length
    ?renderQuestion()
    :finishQuiz();
}

function finishQuiz(){
  const total=courses[state.course].questions.length;
  saveResult(state.course,state.score,total);

  quiz.classList.add("hidden");
  results.classList.remove("hidden");

  results.innerHTML=`
    <div class="card">
      <h2>Results</h2>
      <p>Score: ${state.score}/${total}</p>
      <p>${Math.round(state.score/total*100)}%</p>
      <button class="primary" onclick="renderDashboard()">Back to Dashboard</button>
    </div>
  `;
}

renderDashboard();
</script>
</body>
</html>
