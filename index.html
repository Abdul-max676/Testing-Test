<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENT211 CBT</title>

<style>
/* ===== MOBILE ONLY LOCK ===== */
@media (min-width: 481px){
  body::before{
    content:"This CBT works on mobile phones only.";
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-size:20px;
    padding:20px;
    text-align:center;
    background:#111;
    color:#fff;
  }
  main,header{display:none}
}

/* ===== BASE ===== */
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#f7f9fc;
  color:#111;
}
header{
  background:#1e40af;
  color:#fff;
  padding:12px;
  text-align:center;
  font-weight:600;
}
main{
  max-width:480px;
  margin:auto;
  padding:12px;
}
.card{
  background:#fff;
  border-radius:12px;
  padding:14px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  margin-bottom:12px;
}
.hidden{display:none}
button{
  width:100%;
  padding:14px;
  margin-top:8px;
  font-size:16px;
  border:none;
  border-radius:10px;
}
.option{text-align:left;background:#e5e7eb}
.correct{background:#16a34a;color:#fff}
.wrong{background:#dc2626;color:#fff}
.primary{background:#1e40af;color:#fff}
.progress{font-size:14px;color:#6b7280}
.timer{
  font-weight:700;
  text-align:center;
  margin-bottom:8px;
}
.review-wrong{border-left:4px solid #dc2626;padding-left:8px}
.review-correct{border-left:4px solid #16a34a;padding-left:8px}
</style>
</head>

<body>
<header>ENT211 – CBT Practice</header>
<main>
<section id="dashboard"></section>
<section id="quiz" class="hidden"></section>
<section id="results" class="hidden"></section>
</main>

<script>
/* =====================
   DATA – 100 QUESTIONS
===================== */
const questions=[
...Array.from({length:100},(_,i)=>({
  q:`ENT211 Question ${i+1}: What best describes entrepreneurship?`,
  options:[
    "Paid employment",
    "Creation and management of new ventures",
    "Government ownership",
    "Fixed income activity"
  ],
  answer:1,
  explanation:"Entrepreneurship involves creating and managing new ventures to solve problems and create value."
}))
];

/* =====================
   STATE
===================== */
let index=0,score=0,answers=[];
let timeLeft=40*60;
let timer;

/* =====================
   UI
===================== */
const dashboard=document.getElementById("dashboard");
const quiz=document.getElementById("quiz");
const results=document.getElementById("results");

dashboard.innerHTML=`
<div class="card">
<h3>ENT211 CBT</h3>
<p>100 questions • 40 minutes</p>
<button class="primary" onclick="start()">Start Test</button>
</div>`;

function start(){
  dashboard.classList.add("hidden");
  quiz.classList.remove("hidden");
  startTimer();
  render();
}

function startTimer(){
  timer=setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){
      clearInterval(timer);
      finish();
    }
    document.getElementById("timer").textContent=formatTime(timeLeft);
  },1000);
}

function formatTime(s){
  const m=Math.floor(s/60),sec=s%60;
  return `${m}:${sec.toString().padStart(2,"0")}`;
}

function render(){
  const q=questions[index];
  quiz.innerHTML=`
  <div class="timer" id="timer">${formatTime(timeLeft)}</div>
  <div class="card">
    <div class="progress">Question ${index+1}/100</div>
    <h3>${q.q}</h3>
    ${q.options.map((o,i)=>`<button class="option" onclick="select(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}
    <button class="primary hidden" id="next" onclick="next()">Next</button>
  </div>`;
}

function select(i){
  if(answers[index]!=null)return;
  answers[index]=i;
  const q=questions[index];
  document.querySelectorAll(".option").forEach((b,idx)=>{
    b.disabled=true;
    if(idx===q.answer)b.classList.add("correct");
    if(idx===i && i!==q.answer)b.classList.add("wrong");
  });
  if(i===q.answer)score++;
  document.getElementById("next").classList.remove("hidden");
}

function next(){
  index++;
  index<100?render():finish();
}

function finish(){
  clearInterval(timer);
  quiz.classList.add("hidden");
  results.classList.remove("hidden");

  const wrong=questions
    .map((q,i)=>({q,i}))
    .filter(x=>answers[x.i]!==x.q.answer);

  results.innerHTML=`
  <div class="card">
    <h3>Result</h3>
    <p>Score: ${score}/100</p>
    <p>${score}%</p>
  </div>
  ${wrong.map(w=>`
    <div class="card review-wrong">
      <strong>${w.q.q}</strong>
      <p>Your answer: ${String.fromCharCode(65+answers[w.i])}</p>
      <p class="review-correct">Correct: ${String.fromCharCode(65+w.q.answer)}</p>
      <p>${w.q.explanation}</p>
    </div>
  `).join("")}
  <button class="primary" onclick="location.reload()">Restart</button>`;
}
</script>
</body>
</html>
